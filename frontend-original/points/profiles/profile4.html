      },
      mohammed: {
        name: "Mohammed Ahmed",
        role: "IT Engineer",
        rating: "4.6",
        taught: "28",
        learned: "6",
        points: "72",
        skills: ["Cybersecurity", "Fitness Training", "French"],
        messageText: "Message Mohammed",
        image: "https://lh3.googleusercontent.com/aida-public/AB6AXuCkk1_W8s0C8KLORdNTTeEtj6wyBc70wLFywfJBgIzW2h04NHFMfJ2yBC6PRzPBeawYOO1oIheubAxp8GVhxVODS82xHCAYD9GtSWqBtE48O8k_ZPhGbjEPuXuvzIj6cSc6ljuqjBTyN1fZQoR3boppcCuzAAgi7I_y0xo1gJ9N_eeiCiU6WWd2doXJyXJ4Qu9t--gjKGp1WKp4jtuPFUGnm58Z8l3o37RvQO0Ud2aWu1LWSgY-ssoimQ"
      }
    };

    function switchProfile(profileKey) {
      const data = profiles[profileKey];
      if (!data) return;

      // Update basic fields
      document.getElementById('profile-name').textContent = data.name;
      document.getElementById('profile-role').textContent = data.role;
      document.getElementById('profile-rating').textContent = data.rating;
      document.getElementById('stat-taught').textContent = data.taught;
      document.getElementById('stat-learned').textContent = data.learned;
      document.getElementById('stat-points').textContent = data.points;
      document.getElementById('btn-message').textContent = data.messageText;
      document.getElementById('profile-avatar').src = data.image;

      // Update skills
      const skillsContainer = document.getElementById('profile-skills');
      skillsContainer.innerHTML = '';
      data.skills.forEach(skill => {
        const chip = document.createElement('span');
        chip.className = 'skill-chip';
        chip.textContent = skill;
        skillsContainer.appendChild(chip);
      });

      // Update Tab Styles
      ['alaa', 'samy', 'mohammed'].forEach(key => {
        const tab = document.getElementById('tab-' + key);
        if (key === profileKey) {
          tab.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-[#0b57d0] shadow-sm transition-all';
        } else {
          tab.className = 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all';
        }
      });
    }
  </script>
<!-- END: Interactive Switcher Script -->
