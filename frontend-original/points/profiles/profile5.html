    function switchProfile(profileKey) {
      const data = profileCatalog[profileKey];
      if (!data) return;

      // Update text and image
      document.getElementById('user-avatar').src = data.avatar;
      document.getElementById('user-name').textContent = data.name;
      document.getElementById('user-title').textContent = data.title;
      document.getElementById('user-rating').textContent = data.rating;

      // Re-render skills
      const container = document.getElementById('skills-container');
      container.innerHTML = '';
      data.skills.forEach(skill => {
        const badge = document.createElement('span');
        badge.className = 'px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-[#dcfce7] text-[#047857]';
        badge.textContent = skill;
        container.appendChild(badge);
      });

      // Update Tab Styles
      ['sana', 'amira', 'nada'].forEach(key => {
        const tab = document.getElementById(`tab-${key}`);
        if (key === profileKey) {
          tab.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg bg-[#0052cc] text-white transition-all';
        } else {
          tab.className = 'px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all';
