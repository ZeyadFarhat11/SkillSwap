        skills: ["Cybersecurity", "Fitness Training", "French"],

      },
      {
        name: "Samy Ali",
        title: "Designer",
        rating: "4.1",
        taught: "20",
        learned: "6",
        points: "48",
        skills: ["Figma Design", "Adobe Photoshop", "React"],
        avatarSrc: "https://lh3.googleusercontent.com/aida-public/AB6AXuA6tVxmKwrU9LV8Cgpl60ziDXNBHzIFm7hhbw-BhNTM6mu52iMcYJ1lqX5b1kvvymLX9Mjh9kEzqeLQjtwnxYXVzaAMTq1nyzH1VuKWJLUa-QvJ29k-BB_8hX20B6xVyEvK3GybVaKp_Y2yRU4-zqA1Yhqp5vOAjmumsLnv6R7pjURurOP-GruEzgAqCRBq8Jk1F-7_3CdgGliLSoSzIkZEOkxwn_kRANbmmRPdPw3KUbRr6WY7vQhmXQ"
      }
    ];

    function switchProfile(index) {
      const data = profileData[index];
      if (!data) return;

      // Update avatar & alt
      const avatar = document.getElementById('profile-avatar');
      avatar.src = data.avatarSrc;
      avatar.alt = data.name + ' Avatar';

      // Update Name & Role
      document.getElementById('profile-name').textContent = data.name;
      document.getElementById('profile-title').textContent = data.title;
      document.getElementById('profile-rating').textContent = data.rating;

      // Update Stats
      document.getElementById('stat-taught').textContent = data.taught;
      document.getElementById('stat-learned').textContent = data.learned;
      document.getElementById('stat-points').textContent = data.points;

      // Update Message Button label
      const firstName = data.name.split(' ')[0];
      document.getElementById('btn-message').textContent = `Message ${firstName}`;

      // Update Skills
      const skillsContainer = document.getElementById('skills-container');
      skillsContainer.innerHTML = '';
      data.skills.forEach(skill => {
        const badge = document.createElement('span');
        badge.className = 'px-4 py-1.5 rounded-full bg-[#D6F5E3] text-[#1E7E52] text-xs font-semibold tracking-wide';
        badge.textContent = skill;
        skillsContainer.appendChild(badge);
      });

      // Update switch tabs styling
      for (let i = 0; i < 3; i++) {
        const tab = document.getElementById(`tab-user-${i+1}`);
        if (i === index) {
          tab.className = 'px-4 py-1.5 rounded-full bg-blue-600 text-white transition-all';
        } else {
          tab.className = 'px-4 py-1.5 rounded-full hover:bg-slate-200/60 transition-all text-slate-600';
        }
      }
    }
  </script>
